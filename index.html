

<!DOCTYPE html>

<html lang="en">

<head>

<meta name="viewport" content="width=device-width, initial-scale=1">

<meta name="theme-color" content="#174d3a">

<title>Kingdom Hall Maintenance</title>

<style>

body{font-family:Arial,sans-serif;margin:0;background:#f3f5f3;color:#20352b}

header{background:#174d3a;color:white;padding:24px 18px;border-radius:0 0 22px 22px}

h1{font-size:24px;margin:0 0 8px}

main{padding:16px;max-width:650px;margin:auto}

select,input,button{font:inherit;padding:12px;border-radius:10px;border:1px solid #ccd5ce}

select,input{box-sizing:border-box;width:100%;background:white;margin:6px 0 12px}

.quarters{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin:16px 0}

.quarter{background:white;border:1px solid #d8e1da;padding:18px;border-radius:14px;text-align:left}

.quarter strong{display:block;font-size:20px}

.quarter.active{background:#dcebe1;border:2px solid #28714e}

.task{background:white;padding:14px;border-radius:12px;margin:10px 0;box-shadow:0 1px 3px #0001}

.task label{display:block;font-weight:bold;margin-bottom:8px}

.task input[type=checkbox]{width:auto;margin-right:8px}

.task input[type=text],.task select{margin:5px 0 10px}

small{color:#65766b}

button.primary{background:#174d3a;color:white;border:0;width:100%;margin:6px 0}

button.delete{background:#fff0ee;color:#963c30;border:0;width:auto}

.status{font-size:13px;color:#65766b;margin:8px 0}

</style>

</head>

<body>

<header>

<h1>Kingdom Hall Maintenance</h1>

<div>Quarterly task assignments and completion history</div>

</header>

<main>

<label for="year">Year</label>

<select id="year"></select>

<label for="filterCongregation">Show assignments for</label>

<select id="filterCongregation">

<option value="">All congregations</option>

<option>West</option>

<option>East</option>

<option>Sunset Spanish</option>

</select>

<div class="quarters" id="quarters"></div>

<h2 id="heading">Q1 Tasks</h2>

<div id="tasks"></div>

<h3>Add a task card</h3>

<label for="newTask">Task name</label>

<input id="newTask" placeholder="Enter task name">

<label for="taskQuarter">Quarter</label>

<select id="taskQuarter">

<option value="1">Q1 — January to March</option>

<option value="2">Q2 — April to June</option>

<option value="3">Q3 — July to September</option>

<option value="4">Q4 — October to December</option>

</select>

<button class="primary" id="add">Add task card</button>

<p class="status" id="saveStatus">Assignments save in this browser on this device.</p>

</main>

<script>

const congregationNames=["West","East","Sunset Spanish"];

const defaults=[

["Fire protection",1],

["HVAC system — quarterly",1],

["Interior chairs and furniture",1],

["Plumbing system",1],

["Carpets and mats",1],

["Doors, partitions and windows",1],

["Exterior and structural inspection",1],

["Pest control inspection",2],

["Potable water supply",2],

["Irrigation system",2],

["HVAC system — yearly",2],

["Natural gas and LPG",2],

["Security system",3],

["Fences and gates",3],

["Roof, gutters and downspouts",4],

["Interior and exterior lighting",4],

["Grading and drainage",4],

["Roads, pavement and walkways",4],

["Audio/video system",3],

["Office equipment",3],

["Cleaning equipment",1]

];

const oldKey="kh-maintenance-v1";

const key="kh-maintenance-v2";

let data={};

try{

data=JSON.parse(localStorage.getItem(key)||"{}");

}catch(e){data={};}

let q=1;

const $=id=>document.getElementById(id);

const year=$("year");

for(let y=new Date().getFullYear();y>=2024;y--){

let option=document.createElement("option");

option.value=y;

option.textContent=y;

year.appendChild(option);

}

function makeTask(name,quarter,uid){

return {

name:name,

q:quarter,

uid:uid,

assignedCongregation:"",

person:"",

done:false,

date:""

};

}

// Migrate existing task completion data when possible.

if(!Object.keys(data).length){

try{

const old=JSON.parse(localStorage.getItem(oldKey)||"{}");

const years=[...year.options].map(o=>o.value);

years.forEach(y=>{

let merged=defaults.map((t,i)=>makeTask(t[0],t[1],i+1));

congregationNames.forEach(c=>{

const oldTasks=old[c+"-"+y];

if(!Array.isArray(oldTasks))return;

oldTasks.forEach(t=>{

const match=merged.find(x=>x.name===t.name);

if(match && t.done){

match.done=true;

match.date=t.date||"";

}

});

});

data[y]=merged;

});

}catch(e){}

}

function tasks(){

const y=year.value;

if(!data[y]){

data[y]=defaults.map((t,i)=>makeTask(t[0],t[1],i+1));

}

return data[y];

}

function save(){

localStorage.setItem(key,JSON.stringify(data));

$("saveStatus").textContent="Saved on this device.";

}

function makeSelect(options,value,onchange){

const s=document.createElement("select");

options.forEach(item=>{

const o=document.createElement("option");

o.value=item.value;

o.textContent=item.label;

s.appendChild(o);

});

s.value=value||"";

s.onchange=onchange;

return s;

}

function render(){

$("quarters").innerHTML="";

for(let n=1;n<=4;n++){

const b=document.createElement("button");

b.className="quarter"+(q===n?" active":"");

b.innerHTML="<strong>Q"+n+"</strong><small>"+[

"January – March",

"April – June",

"July – September",

"October – December"

][n-1]+"</small>";

b.onclick=()=>{q=n;render();};

$("quarters").appendChild(b);

}

$("heading").textContent="Q"+q+" Tasks";

const container=$("tasks");

container.innerHTML="";

const filter=$("filterCongregation").value;

const list=tasks().filter(t=>

Number(t.q)===q &&

(!filter || t.assignedCongregation===filter)

);

if(!list.length){

container.textContent="No tasks match this quarter and congregation.";

return;

}

list.forEach(t=>{

const card=document.createElement("div");

card.className="task";

const title=document.createElement("label");

const cb=document.createElement("input");

cb.type="checkbox";

cb.checked=!!t.done;

cb.onchange=()=>{

t.done=cb.checked;

t.date=t.done?new Date().toLocaleDateString():"";

save();

render();

};

title.appendChild(cb);

title.appendChild(document.createTextNode(t.name));

card.appendChild(title);

const congLabel=document.createElement("small");

congLabel.textContent="Assigned congregation";

card.appendChild(congLabel);

const assigned=makeSelect([

{value:"",label:"Choose a congregation"},

...congregationNames.map(c=>({value:c,label:c}))

],t.assignedCongregation,()=>{

t.assignedCongregation=assigned.value;

save();

render();

});

card.appendChild(assigned);

const personLabel=document.createElement("small");

personLabel.textContent="Person responsible";

card.appendChild(personLabel);

const person=document.createElement("input");

person.type="text";

person.placeholder="Enter responsible person's name";

person.value=t.person||"";

person.onchange=()=>{

t.person=person.value.trim();

save();

};

card.appendChild(person);

const status=document.createElement("div");

status.className="status";

status.textContent=t.done

?"Completed: "+(t.date||"Date not recorded")

:"Not completed";

card.appendChild(status);

const del=document.createElement("button");

del.textContent="Delete task";

del.className="delete";

del.onclick=()=>{

if(confirm("Delete this task card?")){

data[year.value]=tasks().filter(x=>x.uid!==t.uid);

save();

render();

}

};

card.appendChild(del);

container.appendChild(card);

});

}

$("add").onclick=()=>{

const name=$("newTask").value.trim();

if(!name){

alert("Enter a task name first.");

return;

}

const a=tasks();

a.push(makeTask(

name,

Number($("taskQuarter").value),

Date.now()

));

$("newTask").value="";

q=Number($("taskQuarter").value);

save();

render();

};

year.onchange=render;

$("filterCongregation").onchange=render;

render();

</script>

</body>

</html>
